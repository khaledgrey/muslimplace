<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi App Musulmana</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(to bottom, #e0f7fa, #fff);
      font-family: 'Segoe UI', sans-serif;
    }
    header {
      background-color: #00695c;
      color: white;
      padding: 1rem;
      text-align: center;
      border-bottom: 5px solid #004d40;
    }
    .prayer-time {
      background-color: #ffffff;
      border-radius: 15px;
      padding: 1rem;
      margin: 1rem auto;
      max-width: 500px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .prayer-time h3 {
      color: #00796b;
    }
    .footer {
      text-align: center;
      margin-top: 2rem;
      padding: 1rem;
      background-color: #004d40;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <h1>🕌 Mi App Musulmana</h1>
    <p>Horarios de oración y guía islámica</p>
  </header>

  <section class="prayer-time">
    <h3>🕋 Horarios de Oración Hoy</h3>
    <ul class="list-group list-group-flush">
      <li class="list-group-item">Fajr (Alba): 05:00 AM</li>
      <li class="list-group-item">Dhuhr (Mediodía): 12:30 PM</li>
      <li class="list-group-item">Asr (Tarde): 04:15 PM</li>
      <li class="list-group-item">Maghrib (Puesta del sol): 06:45 PM</li>
      <li class="list-group-item">Isha (Noche): 08:00 PM</li>
    </ul>
  </section>

  <div class="footer">
    &copy; 2025 Mi App Musulmana. Con amor y fe 🕋
  </div>
</body>
</html>
